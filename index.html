और कहा — "मुझे किसी के घर की ज़रूरत नहीं, मैं खुद अपना घर हूँ।"
लोग कहते थे — "तू कमज़ोर है, तू अकेली कुछ नहीं कर सकती"
तूने कुछ नहीं कहा... बस मुस्कुराई। और उसी मुस्कान से तूने दुनिया बदल दी।

तू पत्थर नहीं... तू वो लौ है जिसे पानी भी बुझा नहीं सकता।
जिसने तुझे कमज़ोर कहा, उसको सुन ले — तू वो नदी है जो पहाड़ को काटकर रास्ता बनाती है।
तू वो आँधी है जो तूफ़ान को भी शर्मसार कर दे।
तू वो आग है जिसे खुद तूने ही जलाया है।
कहते थे — "औरत की जगह चूल्हे के पास है"
तूने कहा — "मेरी जगह वहीं है, जहाँ मैं खड़ी हूँ। और मैं जहाँ खड़ी होती हूँ, वहीं इतिहास लिखा जाता है।"

तू माँ है, बेटी है, बहन है, पत्नी है... पर उससे पहले — तू एक तूफ़ान है। तू एक क्रांति है। तू एक आग है।
और जो भी तुझे रोकने आए... तूने जला दिया।
एक स्त्री के जज्बात उसकी जान हैं, उसकी ताक़त हैं, और उसका गर्व हैं।
वो झुकेगी नहीं। वो रुकेगी नहीं। वो डरेगी नहीं।
क्योंकि वो — एक स्त्री है।`
