<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लेखन और कविताएँ | Richa Humnekar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf9f5;
            color: #2c2825;
        }
        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-100">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-[#faf9f5]/80 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <span class="serif-font text-xl font-medium tracking-wide cursor-pointer" onclick="switchView('Home')">Richa Humnekar</span>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-stone-600">
                <button onclick="switchView('Home')" class="hover:text-stone-900 transition-colors">Home</button>
                <button onclick="switchView('Poetry & Stories')" class="hover:text-stone-900 transition-colors">Poetry & Stories</button>
                <button onclick="switchView('About')" class="hover:text-stone-900 transition-colors">About</button>
                <button onclick="switchView('Connect')" class="hover:text-stone-900 transition-colors">Connect</button>
            </nav>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-stone-700">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden px-6 pb-6 pt-2 border-b border-stone-200 bg-[#faf9f5] flex flex-col gap-4 text-stone-700 font-medium">
            <button onclick="switchView('Home'); toggleMobileMenu();" class="text-left">Home</button>
            <button onclick="switchView('Poetry & Stories'); toggleMobileMenu();" class="text-left">Poetry & Stories</button>
            <button onclick="switchView('About'); toggleMobileMenu();" class="text-left">About</button>
            <button onclick="switchView('Connect'); toggleMobileMenu();" class="text-left">Connect</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">
        <!-- Dynamically injected view will appear here -->
    </main>

    <!-- Footer -->
    <footer class="border-t border-stone-200 py-8 text-center text-sm text-stone-500 bg-[#faf9f5]">
        <p>© 2026 Richa Humnekar. All rights reserved. Crafted with words and quiet reflections.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentView = 'Home';
        
        const pieces = [
            {
                title: "The Student Who Taught Me True Growth",
                titleHindi: "वह छात्र जिसने मुझे सच्ची तरक़्क़ी सिखाई",
                type: "Reflection",
                language: "English",
                date: "Reflection · 5 min",
                excerpt: "Sometimes teaching is the deepest form of learning...",
                content: "Sometimes teaching is the deepest form of learning. In every classroom, digital or physical, we look for students who need guidance, but occasionally, a student comes along whose quiet resilience and genuine curiosity teach us what true growth really looks like..."
            },
            {
                title: "Journey of Scattered Pages",
                titleHindi: "बिखरे पन्नों का सफर",
                type: "Poem",
                language: "Hindi",
                date: "Poem · 4 min",
                excerpt: "वक्त की धूल में चुप-चाप बैठी है...",
                content: "वक्त की धूल में चुप-चाप बैठी है, यादों की एक अलमारी पुरानी। हर पन्ने पर लिखा है सफर, जो खुद में समेटे है एक कहानी..."
            }
        ];

        function renderApp() {
            const main = document.getElementById('main-content');
            if (currentView === 'Home') {
                main.innerHTML = `
                    <section class="space-y-12">
                        <div class="space-y-4">
                            <h1 class="serif-font text-4xl md:text-5xl font-normal leading-tight">Words, Stories, & Quiet Reflections</h1>
                            <p class="text-stone-600 text-lg leading-relaxed max-w-2xl">Welcome to my digital corner. Here I share poetry, reflections on life and learning, and stories woven from everyday moments.</p>
                        </div>
                        <div class="border-t border-stone-200 pt-8">
                            <h2 class="serif-font text-2xl font-normal mb-6">Latest Pieces</h2>
                            <div class="grid gap-6">
                                ${pieces.map(p => `
                                    <div class="p-6 rounded-xl border border-stone-200 bg-white hover:border-stone-300 transition-all">
                                        <span class="text-xs font-semibold uppercase tracking-wider text-amber-800">${p.type} ·${p.language}</span>
                                        <h3 class="serif-font text-xl font-medium mt-1 mb-2">${p.title}</h3>
                                        <p class="text-stone-600 text-sm mb-4">${p.excerpt}</p>
                                        <span class="text-xs text-stone-500">${p.date}</span>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </section>
                `;
            } else if (currentView === 'Poetry & Stories') {
                main.innerHTML = `
                    <section class="space-y-8">
                        <h1 class="serif-font text-4xl font-normal">Poetry & Stories</h1>
                        <div class="grid gap-6">
                            ${pieces.map(p => `
                                <div class="p-6 rounded-xl border border-stone-200 bg-white">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-amber-800">${p.type} ·${p.language}</span>
                                    <h2 class="serif-font text-2xl font-medium mt-1 mb-2">${p.title}</h2>
                                    <h3 class="serif-font text-lg text-stone-600 mb-4">${p.titleHindi}</h3>
                                    <p class="text-stone-700 leading-relaxed whitespace-pre-line">${p.content}</p>
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `;
            } else if (currentView === 'About') {
                main.innerHTML = `
                    <section class="space-y-6 max-w-2xl">
                        <h1 class="serif-font text-4xl font-normal">About Me</h1>
                        <p class="text-stone-700 leading-relaxed text-lg">Hello! I am Richa Humnekar, a content writer, scriptwriter, and educator based in Durg, Chhattisgarh. I love crafting stories, poems, and educational learning resources.</p>
                        <p class="text-stone-700 leading-relaxed">Through this space, I bring together my thoughts, creative expressions, and digital works.</p>
                    </section>
                `;
            } else if (currentView === 'Connect') {
                main.innerHTML = `
                    <section class="space-y-6 max-w-2xl">
                        <h1 class="serif-font text-4xl font-normal">Let's Connect</h1>
                        <p class="text-stone-700 leading-relaxed">If you'd like to collaborate, discuss writing projects, or just say hello, feel free to reach out!</p>
                        <div class="p-6 rounded-xl border border-stone-200 bg-white inline-block">
                            <p class="font-medium text-stone-900">Email: <span class="text-amber-800">richa@example.com</span></p>
                        </div>
                    </section>
                `;
            }
            lucide.createIcons();
        }

        function switchView(view) {
            currentView = view;
            renderApp();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        renderApp();
    </script>
</body>
</html>
