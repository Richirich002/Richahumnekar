<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लेखन और कविताएँ | Richa Humnekar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #faf9f5;
            color: #2c2825;
        }
        h1, h2, h3, .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-amber-100">

    <!-- Navigation -->
    <header class="sticky top-0 z-50 bg-[#faf9f5]/80 backdrop-blur-md border-b border-stone-200">
        <div class="max-w-4xl mx-auto px-6 h-20 flex items-center justify-between">
            <span class="serif-font text-xl font-medium tracking-wide cursor-pointer" onclick="switchView('Home')">Richa Humnekar</span>
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-stone-600">
                <button onclick="switchView('Home')" class="hover:text-stone-900 transition-colors">Home</button>
                <button onclick="switchView('Poetry & Stories')" class="hover:text-stone-900 transition-colors">Poetry & Stories</button>
                <button onclick="switchView('About')" class="hover:text-stone-900 transition-colors">About</button>
                <button onclick="switchView('Connect')" class="hover:text-stone-900 transition-colors">Connect</button>
            </nav>
            <button onclick="toggleMobileMenu()" class="md:hidden p-2 text-stone-700">
                <i data-lucide="menu" id="menu-icon"></i>
            </button>
        </div>
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden px-6 pb-6 pt-2 border-b border-stone-200 bg-[#faf9f5] flex flex-col gap-4 text-stone-700 font-medium">
            <button onclick="switchView('Home'); toggleMobileMenu();" class="text-left">Home</button>
            <button onclick="switchView('Poetry & Stories'); toggleMobileMenu();" class="text-left">Poetry & Stories</button>
            <button onclick="switchView('About'); toggleMobileMenu();" class="text-left">About</button>
            <button onclick="switchView('Connect'); toggleMobileMenu();" class="text-left">Connect</button>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="main-content" class="flex-grow max-w-4xl mx-auto px-6 py-12 w-full">
        <!-- Dynamically injected view will appear here -->
    </main>

    <!-- Footer -->
    <footer class="border-t border-stone-200 py-8 text-center text-sm text-stone-500 bg-[#faf9f5]">
        <p>© 2026 Richa Humnekar. All rights reserved. Crafted with words and quiet reflections.</p>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let currentView = 'Home';

        const pieces = [{{
        title: "A Woman, Your Emotions",
        titleHindi: "एक स्त्री तेरे जज्बात",
        type: "Poem",
        language: "Hindi",
        date: "Poem · 5 min",
        excerpt: "तू रोई है? हाँ... रोई है तू। पर तूने कभी किसी के आगे हाथ नहीं फैलाए...",
        translation: "You cried? Yes... you cried. But you never stretched your hand out before anyone...",
        read: "तू रोई है?<br>हाँ... रोई है तू।<br><br>पर तूने कभी किसी के आगे<br>हाथ नहीं फैलाए।<br><br>रोना तेरी कमज़ोरी नहीं,<br>तेरी ईमानदारी है।<br><br>जिस दरवाज़े पर खड़ी रहती थी तू,<br>\"मुझे अंदर आने दो\" कहते हुए,<br>आज वो दरवाज़ा तूने<br>खुद तोड़ दिया।<br><br>और कहा —<br>\"मुझे किसी के घर की ज़रूरत नहीं,<br>मैं खुद अपना घर हूँ।\"<br><br>लोग कहते थे —<br>\"तू कमज़ोर है, तू अकेली कुछ नहीं कर सकती\"<br><br>तूने कुछ नहीं कहा...<br><br>बस मुस्कुराई।<br><br>और उसी मुस्कान से तूने<br>दुनिया बदल दी।<br><br>जिस समाज ने तुझसे कहा —<br>\"शर्म कर, चुप रह, सह ले\"<br>उसी समाज को तूने<br>आँख में आँख डालकर देखा।<br><br>और जब तूने बोला...<br>तो पहाड़ हिल गए,<br>तो आसमान झुक गया,<br>तो ज़मीन ने कहा —<br>\"ये औरत मेरी रौनक़ है।\"<br><br>तू वो है<br>जिसने दर्द को ताक़त बनाया,<br>जिसने आँसुओं को अमृत बनाया,<br>जिसने टूटन को तख़्त बनाया।<br><br>तू पत्थर नहीं...<br>तू वो लौ है जिसे पानी भी<br>बुझा नहीं सकता।<br><br>जिसने तुझे कमज़ोर कहा,<br>उसको सुन ले —<br>तू वो नदी है<br>जो पहाड़ को काटकर रास्ता बनाती है।<br><br>तू वो आँधी है<br>जो तूफ़ान को भी शर्मसार कर दे।<br><br>तू वो आग है<br>जिसे खुद तूने ही जलाया है।<br><br>कहते थे —<br>\"औरत की जगह चूल्हे के पास है\"<br><br>तूने कहा —<br>\"मेरी जगह वहीं है,<br>जहाँ मैं खड़ी हूँ।<br>और मैं जहाँ खड़ी होती हूँ,<br>वहीं इतिहास लिखा जाता है।\"<br><br>जिस रात तू सबसे टूटी थी,<br>उसी रात तूने कहा था —<br>\"ये दर्द मुझे कुचलेगा?<br>नहीं...<br>ये दर्द मुझे ताज पहनाएगा।\"<br><br>और आज... तू ताज पहनी बैठी है।<br><br>तू माँ है, बेटी है, बहन है, पत्नी है...<br>पर उससे पहले —<br>तू एक तूफ़ान है।<br>तू एक क्रांति है।<br>तू एक आग है।<br><br>और जो भी तुझे रोकने आए...<br>तूने जला दिया।<br><br>एक स्त्री के जज्बात<br>उसकी जान हैं,<br>उसकी ताक़त हैं,<br>और उसका गर्व हैं।<br><br>वो झुकेगी नहीं।<br>वो रुकेगी नहीं।<br>वो डरेगी नहीं।<br>क्योंकि वो — एक स्त्री है।"
    },
        title: "Me and the Moon",
        titleHindi: "मैं और चाँद",
        type: "Poem",
        language: "Hindi",
        date: "Poem · 4 min",
        excerpt: "हर रात जब दुनिया सो जाती है, मैं अपनी छत पर बैठ जाती हूँ...",
        translation: "Every night when the world falls asleep, I sit on my terrace...",
        read: "हर रात जब दुनिया सो जाती है, <br>मैं अपनी छत पर बैठ जाती हूँ।<br><br>चाँद वहीं होता है —<br>जैसे पूरा आसमान उसी के लिए खाली कर दिया हो।<br><br>मैं उससे बात करती हूँ।<br>नहीं... मैं उसे सुनाती हूँ।<br><br>वो बोलता नहीं,<br>पर हर रात<br>नए रूप में दिखकर<br>जैसे कहता है —<br><br>\"आज तू कुछ नया बन रही है, ये दिख रहा है मुझे।\"<br><br>कभी वो पूरा होता है,<br>तो मैं सोचती हूँ — शायद मेरे अंदर<br>आज सब कुछ भरा हुआ है।<br><br>कभी वो आधा होता है,<br>तो लगता है — कुछ अधूरा है,<br>पर वो आधा भी इतना खूबसूरत होता है कि<br>अधूरापन भी एक कला लगने लगता है।<br><br>मैंने ब्रेकअप की रात चाँद को देखा था।<br>वो चाँदनी बिखरी हुई थी —<br>जैसे वो भी रो रहा हो।<br><br>मैंने कहा —<br>\"चाँद, तू भी टूटा है क्या?\"<br><br>और शायद उसी रात<br>मैंने पहली बार सोचा —<br><br>टूटा हुआ भी तो चमकता है।<br><br>आज भी मैं उससे मिलने जाती हूँ।<br>हर रात। बिना किसी अपॉइंटमेंट के।<br>हर कोई जानता है उसे...<br>पर उसका दिल सिर्फ़ मुझे दिखता है।<br><br>चाँद... तू मेरा सबसे सच्चा दोस्त है।<br><br>तूने कभी मुझसे जवाब नहीं माँगा,<br>कभी मुझे बदलने को नहीं कहा,<br>कभी मुझे जज नहीं किया।<br><br>बस... हर रात, वहीं, वही जगह, वही खामोशी — मेरे लिए।<br><br>और शायद इसलिए<br>जब मैं कहती हूँ —<br><br>\"मैं अकेली हूँ\"<br><br>तो चाँद मुस्कुरा देता है क्योंकि<br>वो जानता है — मैं उसके साथ हूँ। 🌙"
    },
            {
                title: "A room for the rain",
                titleHindi: "बारिश के लिए एक कमरा",
                type: "Poem",
                language: "English",
                date: "Poem · 4 min",
                excerpt: "I leave one window unlatched / for the rain to remember / the way home.",
                translation: "एक खिड़की खुली छोड़ देती हूँ / ताकि बारिश को याद रहे / घर लौटने का रास्ता।",
                read: "Some evenings the sky lowers its voice. The cup cools beside me, the page waits, and every small sound finds a place to sit. Rain doesn't knock; it enters like an old friend who knows where the spare key is kept under the sill."
            },
            {
                title: "The weight of old letters",
                titleHindi: "पुरानी चिट्ठियों का वज़न",
                type: "Reflection",
                language: "Hindi",
                date: "Reflection · 3 min",
                excerpt: "कागज़ की तहों में दबी स्याही, समय बीतने के बाद भी बोलती है।",
                translation: "Ink folded within paper speaks long after time has passed.",
                read: "जब हम पुरानी डायरियां खोलते हैं, तो सिर्फ शब्द नहीं मिलते—वह दौर लौट आता है जब सांसें धीमी थीं और उम्मीदें लंबी। कागज़ पीला पड़ सकता है, लेकिन उन पन्नों पर ठहरी भावनाएं कभी बूढ़ी नहीं होतीं।"
            }
        ];

        function switchView(view) {
            currentView = view;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }

        function render() {
            const container = document.getElementById('main-content');
            
            if (currentView === 'Home') {
                container.innerHTML = `
                    <div class="space-y-16">
                        <section class="max-w-2xl py-8">
                            <h1 class="serif-font text-4xl md:text-5xl font-normal leading-tight text-stone-900 mb-6">
                                Where quiet thoughts find their shelter in words.
                            </h1>
                            <p class="text-lg text-stone-600 font-light leading-relaxed mb-8">
                                Welcome to my corner of poetry, stories, and mindful reflections. Written in Hindi and English, exploring everyday silences and deeper truths.
                            </p>
                            <div class="flex gap-4">
                                <button onclick="switchView('Poetry & Stories')" class="px-6 py-3 bg-stone-900 text-stone-50 text-sm font-medium rounded-full hover:bg-stone-800 transition-all flex items-center gap-2">
                                    Explore Writings <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </section>

                        <section class="border-t border-stone-200 pt-12">
                            <h2 class="serif-font text-2xl font-normal text-stone-900 mb-8">Featured Pieces</h2>
                            <div class="grid gap-6 md:grid-cols-2">
                                ${pieces.map((item, idx) => `
                                    <div onclick="openPiece(${idx})" class="group p-6 bg-white rounded-2xl border border-stone-200 hover:border-stone-400 transition-all cursor-pointer shadow-sm">
                                        <div class="text-xs font-medium text-stone-400 mb-2">${item.date}</div>
                                        <h3 class="serif-font text-xl font-medium text-stone-900 group-hover:text-amber-800 transition-colors mb-1">${item.title}</h3>
                                        <div class="text-sm font-medium text-stone-600 mb-3">${item.titleHindi}</div>
                                        <p class="text-sm text-stone-500 line-clamp-2">${item.excerpt}</p>
                                    </div>
                                `).join('')}
                            </div>
                        </section>
                    </div>
                `;
            } else if (currentView === 'Poetry & Stories') {
                container.innerHTML = `
                    <div class="space-y-8">
                        <div>
                            <h1 class="serif-font text-3xl font-normal text-stone-900 mb-2">Poetry & Stories</h1>
                            <p class="text-stone-600">A collection of thoughts, poems, and short reflections.</p>
                        </div>
                        <div class="space-y-4">
                            ${pieces.map((item, idx) => `
                                <div onclick="openPiece(${idx})" class="p-6 bg-white rounded-2xl border border-stone-200 hover:border-stone-400 transition-all cursor-pointer flex justify-between items-center">
                                    <div>
                                        <span class="text-xs text-stone-400">${item.date}</span>
                                        <h3 class="serif-font text-xl text-stone-900 mt-1">${item.title} / <span class="text-stone-600">${item.titleHindi}</span></h3>
                                        <p class="text-sm text-stone-500 mt-2">${item.excerpt}</p>
                                    </div>
                                    <i data-lucide="arrow-right" class="w-5 h-5 text-stone-400"></i>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (currentView === 'About') {
                container.innerHTML = `
                    <div class="max-w-2xl space-y-6">
                        <h1 class="serif-font text-3xl font-normal text-stone-900">About Me</h1>
                        <p class="text-lg text-stone-700 leading-relaxed font-light">
                            Hello! I am Richa Humnekar, a writer, content creator, and educator based in Durg, Chhattisgarh. I love crafting stories, poetry, children's books, and reflective pieces that capture the quiet beauty of everyday life.
                        </p>
                        <p class="text-stone-600 leading-relaxed">
                            Through this digital space, I share my creative journey, writings in Hindi and English, and various thoughts translated from the heart onto the page.
                        </p>
                    </div>
                `;
            } else if (currentView === 'Connect') {
                container.innerHTML = `
                    <div class="max-w-xl space-y-6">
                        <h1 class="serif-font text-3xl font-normal text-stone-900">Let's Connect</h1>
                        <p class="text-stone-600">Have a question, collaboration idea, or just want to say hello? Drop a message below.</p>
                        <div class="bg-white p-6 rounded-2xl border border-stone-200 space-y-4 shadow-sm">
                            <div>
                                <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Your Name</label>
                                <input type="text" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:border-stone-600" placeholder="Enter your name">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Email</label>
                                <input type="email" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:border-stone-600" placeholder="your@email.com">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-stone-600 uppercase mb-1">Message</label>
                                <textarea rows="4" class="w-full px-4 py-2 border border-stone-300 rounded-lg focus:outline-none focus:border-stone-600" placeholder="Your message..."></textarea>
                            </div>
                            <button onclick="alert('Thank you! Your message has been noted.')" class="w-full py-3 bg-stone-900 text-stone-50 rounded-lg font-medium hover:bg-stone-800 transition-colors">Send Message</button>
                        </div>
                    </div>
                `;
            }
            lucide.createIcons();
        }

        function openPiece(idx) {
            const item = pieces[idx];
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="max-w-2xl space-y-8">
                    <button onclick="switchView('Poetry & Stories')" class="flex items-center gap-2 text-sm text-stone-600 hover:text-stone-900">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Back to all pieces
                    </button>
                    <div>
                        <span class="text-xs text-stone-400">${item.date}</span>
                        <h1 class="serif-font text-3xl md:text-4xl text-stone-900 mt-2 mb-1">${item.title}</h1>
                        <h2 class="serif-font text-xl text-stone-600 font-normal">${item.titleHindi}</h2>
                    </div>
                    <div class="prose prose-stone text-stone-700 leading-relaxed space-y-6 text-lg font-light">
                        <p>${item.read}</p>
                        ${item.translation ? `<div class="p-6 bg-stone-100 rounded-xl border-l-4 border-stone-400 text-stone-800 text-base italic"><p>${item.translation}</p></div>` : ''}
                    </div>
                </div>
            `;
            lucide.createIcons();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Initial Load
        render();
    </script>
</body>
</html>
